<style>
	body { font: 13px/1.5 Inter, system-ui, sans-serif; margin: 16px; color: #0E1420; }
	h1 { font-size: 15px; margin: 0 0 8px; }
	p { margin: 0 0 12px; color: #6B7286; }
	input[type=file] { width: 100%; margin-bottom: 12px; }
	button { width: 100%; padding: 9px; border: 0; border-radius: 8px; background: #1F26E8; color: #fff; font-weight: 600; cursor: pointer; }
	button:disabled { opacity: .45; cursor: default; }
	#status { margin-top: 12px; white-space: pre-line; color: #6B7286; }
</style>
<h1>InsureNow HTML Import</h1>
<p>Choose <b>insurenow-pages.json</b> (or one or more page .json files) and click Import. Each page becomes a frame on the current Figma page.</p>
<input id="file" type="file" accept=".json,application/json" multiple>
<button id="go" disabled>Import</button>
<div id="status"></div>
<script>
	const file = document.getElementById('file');
	const go = document.getElementById('go');
	const status = document.getElementById('status');
	let pages = [];

	file.onchange = async () => {
		pages = [];
		for (const f of file.files) {
			const data = JSON.parse(await f.text());
			if (Array.isArray(data)) pages.push(...data);
			else if (Array.isArray(data.pages)) pages.push(...data.pages);
			else pages.push(data);
		}
		status.textContent = pages.length + ' page(s) ready.';
		go.disabled = pages.length === 0;
	};

	go.onclick = () => {
		go.disabled = true;
		status.textContent = 'Importing…';
		parent.postMessage({pluginMessage: {type: 'import', pages}}, '*');
	};

	onmessage = (e) => {
		const msg = e.data.pluginMessage;
		if (!msg) return;
		if (msg.type === 'progress') status.textContent = msg.text;
		if (msg.type === 'done') { status.textContent = msg.text; go.disabled = false; }
	};
</script>
