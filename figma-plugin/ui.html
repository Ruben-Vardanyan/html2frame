<style>
	/* Figma passes its theme as --figma-color-* (showUI themeColors: true); the fallbacks are for a plain browser. */
	:root {
		--bg: var(--figma-color-bg, #ffffff);
		--bg-2: var(--figma-color-bg-secondary, #f5f5f5);
		--bg-hover: var(--figma-color-bg-hover, #f0f0f0);
		--text: var(--figma-color-text, #1e1e1e);
		--text-2: var(--figma-color-text-secondary, #6b6b6b);
		--text-3: var(--figma-color-text-tertiary, #9a9a9a);
		--line: var(--figma-color-border, #e6e6e6);
		--brand: var(--figma-color-bg-brand, #0d99ff);
		--brand-hover: var(--figma-color-bg-brand-hover, #007be5);
		--on-brand: var(--figma-color-text-onbrand, #ffffff);
		--brand-soft: color-mix(in srgb, var(--brand) 12%, transparent);
		--danger: var(--figma-color-text-danger, #dc3412);
		--warn: var(--figma-color-text-warning, #b86200);
		--ok: var(--figma-color-text-success, #14ae5c);
		--radius: 8px;
	}
	/* scrollbars and native controls follow Figma's theme (html.figma-dark with themeColors) */
	:root { color-scheme: light; --scroll: var(--figma-color-border-strong, #c9ccd1); }
	html.figma-dark { color-scheme: dark; --scroll: var(--figma-color-border-strong, #4a4a4a); }
	* { box-sizing: border-box; scrollbar-width: thin; scrollbar-color: var(--scroll) transparent; }
	[hidden] { display: none !important; }
	::-webkit-scrollbar { width: 8px; height: 8px; }
	::-webkit-scrollbar-track { background: transparent; }
	::-webkit-scrollbar-thumb { background: var(--scroll); border-radius: 8px; border: 2px solid transparent; background-clip: padding-box; }
	html, body { height: 100%; }
	body { margin: 0; display: flex; flex-direction: column; background: var(--bg); color: var(--text); font: 12px/1.45 Inter, system-ui, -apple-system, "Segoe UI", sans-serif; -webkit-font-smoothing: antialiased; }
	button { font: inherit; color: inherit; }
	svg { flex: none; }

	header { display: flex; align-items: center; gap: 10px; padding: 14px 16px; border-bottom: 1px solid var(--line); }
	.logo { width: 32px; height: 32px; flex: none; } /* assets/icon-adaptive.svg inline; colours follow Figma's theme */
	.title { font-weight: 600; font-size: 13px; }
	.subtitle { color: var(--text-2); font-size: 11px; }

	main { flex: 1; overflow: auto; padding: 4px 16px 16px; }
	main.drag { outline: 2px dashed var(--brand); outline-offset: -8px; background: var(--brand-soft); }
	section { padding-top: 14px; }
	.section-head { display: flex; align-items: center; justify-content: space-between; margin-bottom: 8px; }
	.section-head h2 { margin: 0; font-size: 11px; font-weight: 600; color: var(--text-2); text-transform: uppercase; letter-spacing: .6px; }
	.links { display: flex; gap: 10px; }
	.link { background: none; border: 0; padding: 0; color: var(--brand); cursor: pointer; font-size: 11px; font-weight: 500; }
	.link:hover { text-decoration: underline; }

	/* source choices */
	.sources { display: grid; grid-template-columns: 1fr 1fr; gap: 8px; }
	.source { position: relative; display: flex; flex-direction: column; align-items: flex-start; gap: 6px; padding: 12px; border: 1px solid var(--line); border-radius: var(--radius); background: var(--bg); text-align: left; cursor: pointer; transition: border-color .12s, background .12s; }
	.source:hover { border-color: var(--brand); background: var(--brand-soft); }
	.source .icon { width: 28px; height: 28px; border-radius: 6px; background: var(--bg-2); display: grid; place-items: center; color: var(--text); }
	.source b { font-size: 12px; font-weight: 600; }
	.source span { color: var(--text-2); font-size: 11px; }
	.source input { position: absolute; inset: 0; opacity: 0; cursor: pointer; }

	/* loaded file */
	.file { display: none; align-items: center; gap: 10px; padding: 10px 12px; border: 1px solid var(--line); border-radius: var(--radius); background: var(--bg-2); }
	.file .icon { width: 32px; height: 32px; border-radius: 6px; background: var(--brand); color: var(--on-brand); display: grid; place-items: center; }
	.file .meta { flex: 1; min-width: 0; }
	.file .name { font-weight: 600; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
	.file .sub { color: var(--text-2); font-size: 11px; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
	body.loaded .sources { display: none; }
	body.loaded .file { display: flex; }

	/* choices: screen sizes, variants, groups (all unticked at first; at least one of each is required) */
	.needs-file { display: none; }
	body.loaded .needs-file { display: block; }
	.hint { margin: 6px 2px 0; color: var(--text-3); font-size: 11px; }
	.section-head h2 .req { margin-left: 6px; font-weight: 500; text-transform: none; letter-spacing: 0; color: var(--text-3); }
	.choice.missing .section-head h2 .req { color: var(--danger); }
	.list { border: 1px solid var(--line); border-radius: var(--radius); overflow: hidden; }
	.row { display: flex; align-items: center; gap: 10px; padding: 8px 10px; cursor: pointer; user-select: none; transition: background .12s; }
	.row + .row { border-top: 1px solid var(--line); }
	.row:hover { background: var(--bg-hover); }
	.row:has(input:checked) { background: var(--brand-soft); }
	.row .grow { flex: 1; min-width: 0; display: flex; align-items: baseline; gap: 8px; white-space: nowrap; overflow: hidden; }
	.row .name { font-weight: 500; overflow: hidden; text-overflow: ellipsis; }
	.row .dim { color: var(--text-2); font-size: 11px; font-variant-numeric: tabular-nums; }
	.pill { min-width: 22px; padding: 1px 7px; border-radius: 10px; background: var(--bg-2); color: var(--text-2); font-size: 11px; font-weight: 500; text-align: center; }
	input[type=checkbox] { width: 14px; height: 14px; margin: 0; accent-color: var(--brand); cursor: pointer; flex: none; }

	/* layout choice */
	.segmented { display: grid; grid-template-columns: 1fr 1fr; gap: 8px; }
	.option { display: flex; flex-direction: column; gap: 8px; padding: 10px; border: 1px solid var(--line); border-radius: var(--radius); cursor: pointer; transition: border-color .12s, background .12s; }
	.option:hover { background: var(--bg-hover); }
	.option input { display: none; }
	.option:has(input:checked) { border-color: var(--brand); box-shadow: inset 0 0 0 1px var(--brand); background: var(--brand-soft); }
	.option b { font-weight: 600; }
	.option span { color: var(--text-2); font-size: 11px; }
	.thumb { height: 44px; border-radius: 5px; background: var(--bg-2); display: flex; gap: 4px; padding: 6px; }
	.thumb i { display: block; border-radius: 2px; background: var(--text-3); opacity: .55; }
	.option:has(input:checked) .thumb i { background: var(--brand); opacity: .8; }
	.toggle-row { margin-top: 8px; border: 1px solid var(--line); border-radius: var(--radius); }
	/* sections: per screen, per group, per group and screen (D19) */
	.sub-head { margin: 12px 2px 6px; font-size: 11px; font-weight: 600; color: var(--text-2); }
	.choice3 { display: grid; grid-template-columns: repeat(3, 1fr); gap: 6px; }
	.choice3.two { grid-template-columns: repeat(2, 1fr); }
	.choice3 label { display: flex; align-items: center; justify-content: center; padding: 7px 6px; border: 1px solid var(--line); border-radius: 6px; cursor: pointer; font-weight: 500; text-align: center; transition: border-color .12s, background .12s; }
	.choice3 label:hover { background: var(--bg-hover); }
	.choice3 input { display: none; }
	.choice3 label:has(input:checked) { border-color: var(--brand); box-shadow: inset 0 0 0 1px var(--brand); background: var(--brand-soft); }

	/* report */
	.report { display: none; border: 1px solid var(--line); border-radius: var(--radius); padding: 10px 12px; }
	.report.show { display: block; }
	.report .headline { display: flex; align-items: center; gap: 8px; font-weight: 600; margin-bottom: 6px; }
	.report .headline.ok { color: var(--ok); }
	.report .headline.bad { color: var(--danger); }
	.report h3 { margin: 10px 0 2px; font-size: 11px; font-weight: 600; color: var(--text-2); }
	.report ul { margin: 0; padding-left: 16px; }
	.report li { margin: 1px 0; overflow-wrap: anywhere; }
	.report li.warn { color: var(--warn); list-style: none; margin-left: -16px; }

	/* footer */
	footer { border-top: 1px solid var(--line); padding: 12px 16px 14px; display: flex; flex-direction: column; gap: 10px; }
	.status { min-height: 16px; color: var(--text-2); font-size: 11px; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
	.status.error { color: var(--danger); white-space: normal; }
	.bar { height: 4px; border-radius: 2px; background: var(--bg-2); overflow: hidden; display: none; }
	.bar.show { display: block; }
	.bar > div { height: 100%; width: 0; background: var(--brand); transition: width .15s; }
	.primary { height: 36px; border: 0; border-radius: 6px; background: var(--brand); color: var(--on-brand); font-weight: 600; cursor: pointer; }
	.primary:hover:not(:disabled) { background: var(--brand-hover); }
	.primary:disabled { opacity: .4; cursor: default; }
	.legal { margin-top: -2px; text-align: center; color: var(--text-3); font-size: 10px; }
	.legal a { color: var(--text-3); }
	.legal a:hover { color: var(--brand); }
</style>

<header>
	<svg class="logo" viewBox="0 0 128 128" width="32" height="32" role="img" aria-label="html2frame"><rect x="26" y="26" width="76" height="76" fill="none" stroke="#E2554F" stroke-width="3.5"/><g style="fill: var(--bg)" stroke="#E2554F" stroke-width="3.5"><rect x="21" y="21" width="10" height="10"/><rect x="97" y="21" width="10" height="10"/><rect x="21" y="97" width="10" height="10"/><rect x="97" y="97" width="10" height="10"/></g><path style="stroke: var(--text)" d="M50 49 L37 64 L50 79 M78 49 L91 64 L78 79 M69 45 L59 83" fill="none" stroke-width="6" stroke-linecap="round" stroke-linejoin="round"/></svg>
	<div>
		<div class="title">html2frame</div>
		<div class="subtitle">Web pages to editable Figma frames</div>
	</div>
</header>

<main id="main">
	<section>
		<div class="section-head"><h2>Source</h2></div>
		<div class="sources">
			<button class="source" id="latest" type="button">
				<div class="icon"><svg width="16" height="16" viewBox="0 0 16 16" fill="none" stroke="currentColor" stroke-width="1.4" stroke-linecap="round" stroke-linejoin="round"><rect x="2" y="3" width="12" height="9" rx="1.5"/><path d="M5.5 14h5M8 12v2"/></svg></div>
				<b>Latest from panel</b>
				<span>localhost:5600</span>
			</button>
			<label class="source">
				<div class="icon"><svg width="16" height="16" viewBox="0 0 16 16" fill="none" stroke="currentColor" stroke-width="1.4" stroke-linecap="round" stroke-linejoin="round"><path d="M9 2H4.5A1.5 1.5 0 0 0 3 3.5v9A1.5 1.5 0 0 0 4.5 14h7a1.5 1.5 0 0 0 1.5-1.5V6z"/><path d="M9 2v4h4"/></svg></div>
				<b>Choose file</b>
				<span>or drop a .json here</span>
				<input id="file" type="file" accept=".json,application/json" multiple>
			</label>
		</div>
		<div class="file">
			<div class="icon"><svg width="16" height="16" viewBox="0 0 16 16" fill="none" stroke="currentColor" stroke-width="1.4" stroke-linecap="round" stroke-linejoin="round"><path d="M9 2H4.5A1.5 1.5 0 0 0 3 3.5v9A1.5 1.5 0 0 0 4.5 14h7a1.5 1.5 0 0 0 1.5-1.5V6z"/><path d="M9 2v4h4"/></svg></div>
			<div class="meta">
				<div class="name" id="fileName"></div>
				<div class="sub" id="fileMeta"></div>
			</div>
			<button class="link" id="change" type="button">Change</button>
		</div>
	</section>

	<div class="needs-file" id="choices"></div>

	<section class="needs-file">
		<div class="section-head"><h2>Layout</h2></div>
		<div class="segmented">
			<label class="option">
				<input type="radio" name="layout" value="single" checked>
				<div class="thumb" style="flex-direction:column"><i style="height:6px;width:60%"></i><i style="height:8px;width:100%"></i><i style="height:8px;width:70%"></i></div>
				<div><b>One page</b><br><span>Sections on the current page</span></div>
			</label>
			<label class="option">
				<input type="radio" name="layout" value="pages">
				<div class="thumb"><i style="width:30%"></i><i style="width:30%"></i><i style="width:30%"></i></div>
				<div><b>Page per screen</b><br><span>A Figma page for each size</span></div>
			</label>
		</div>
		<div class="sub-head">Sections</div>
		<div class="choice3" id="sectionsChoice">
			<label><input type="radio" name="sections" value="screen" checked>Screen</label>
			<label><input type="radio" name="sections" value="group">Group</label>
			<label id="groupScreen"><input type="radio" name="sections" value="group-screen">Group + screen</label>
		</div>
		<p class="hint" id="sectionsHint"></p>
		<label class="row toggle-row">
			<input type="checkbox" id="autoLayout">
			<span class="grow"><span class="name">Use Auto Layout</span><span class="dim">flex rows and columns</span></span>
		</label>
		<p class="hint">Frames whose layout Auto Layout reproduces exactly get it (direction, gap, padding, alignment); the rest keep exact positions.</p>
	</section>

	<section>
		<div class="report" id="report"></div>
	</section>
</main>

<footer>
	<div class="status" id="status">Load a capture to begin.</div>
	<div class="bar" id="bar"><div></div></div>
	<button class="primary" id="go" type="button" disabled>Import</button>
	<div class="legal">MIT License · © 2026 Ruben Vardanyan · <a href="#" id="repo">GitHub</a></div>
</footer>

<script>
	const PANEL = 'http://localhost:5600/api/captures/latest';
	const $ = id => document.getElementById(id);
	let busy = false, choices = null; // choices: {screens, variants, groups, combos} from the plugin
	// true after a successful import: Import stays locked ("Imported ✓") until the selection or layout changes,
	// so a second click cannot add a duplicate by accident
	let imported = false;

	function send(msg) {
		parent.postMessage({pluginMessage: msg}, '*');
	}

	function setStatus(text, error) {
		$('status').textContent = text || '';
		$('status').classList.toggle('error', !!error);
	}

	function esc(s) {
		return String(s).replace(/[&<>"]/g, c => ({'&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;'}[c]));
	}

	// ---- loading ----------------------------------------------------------------------------------------

	$('latest').onclick = async () => {
		setStatus('Loading from the panel…');
		try {
			const res = await fetch(PANEL);
			if (!res.ok) throw new Error(res.status === 404 ? 'the panel has no captures yet' : 'HTTP ' + res.status);
			send({type: 'load', files: [await res.json()], source: 'Control panel'});
		} catch (e) {
			setStatus('Could not reach the control panel (' + e.message + '). Start it, or choose a file.', true);
		}
	};

	async function readFiles(list) {
		const files = [];
		let names = [];
		try {
			for (const f of list) {
				files.push(JSON.parse(await f.text()));
				names.push(f.name);
			}
		} catch (e) {
			setStatus('That file is not valid JSON: ' + e.message, true);
			return;
		}
		if (files.length) {
			setStatus('Reading ' + names.join(', ') + '…');
			send({type: 'load', files, source: names.join(', ')});
		}
	}

	$('file').onchange = () => readFiles($('file').files);

	const main = $('main');
	main.addEventListener('dragover', e => { e.preventDefault(); main.classList.add('drag'); });
	main.addEventListener('dragleave', e => { if (e.target === main) main.classList.remove('drag'); });
	main.addEventListener('drop', e => {
		e.preventDefault();
		main.classList.remove('drag');
		if (!busy && e.dataTransfer.files.length) readFiles(e.dataTransfer.files);
	});

	$('change').onclick = () => {
		if (busy) return;
		document.body.classList.remove('loaded');
		$('file').value = '';
		$('report').classList.remove('show');
		choices = null;
		lists = [];
		setStatus('Load a capture to begin.');
		refresh(false);
	};

	// ---- choices: screen sizes, variants (or one list per dimension), groups ---------------------------
	// Everything starts unticked; the user picks. A list is shown only when it has more than one option
	// (screen sizes always), and every shown list needs at least one tick.

	let lists = []; // [{id, title, options, need, dim?, always?, hint?}]

	function makeLists(msg) {
		const out = [{id: 'screens', title: 'Screen sizes', options: msg.screens, always: true, need: 'Choose at least one screen size.',
			hint: 'Only the sizes in this capture. For more, tick them under Screen sizes in the control panel and capture again.'}];
		if (msg.dimensions && msg.dimensions.length) {
			msg.dimensions.forEach((d, i) => out.push({id: 'dim' + i, title: d.name, options: d.options, dim: d.name, need: 'Choose at least one ' + d.name.toLowerCase() + '.'}));
		} else {
			out.push({id: 'variants', title: 'Languages & variants', options: msg.variants, need: 'Choose at least one language or variant.'});
		}
		out.push({id: 'groups', title: 'Groups', options: msg.groups, need: 'Choose at least one group.'});
		return out;
	}

	function shown(list) {
		return list.always || list.options.length > 1;
	}

	function sectionOf(list) {
		return document.querySelector('.choice[data-list="' + list.id + '"]');
	}

	// ticked option ids of a list; a hidden list means its single option
	function picked(list) {
		if (!shown(list)) return list.options.map(o => o.id);
		return [...sectionOf(list).querySelectorAll('input:checked')].map(b => b.value);
	}

	function listById(id) {
		return lists.find(l => l.id === id);
	}

	// variants that match the ticks: directly, or a tick in every dimension (Language and Theme)
	function pickedVariants() {
		const dims = lists.filter(l => l.dim);
		if (!dims.length) return picked(listById('variants'));
		const sets = dims.map(l => [l.dim, new Set(picked(l))]);
		return choices.variants.filter(v => sets.every(([name, set]) => set.has(v.parts[name]))).map(v => v.id);
	}

	function frameCount() {
		if (!choices) return 0;
		const s = new Set(picked(listById('screens'))), v = new Set(pickedVariants()), g = new Set(picked(listById('groups')));
		let n = 0;
		for (const [key, count] of Object.entries(choices.combos)) {
			const [ks, kv, kg] = key.split('\n');
			if (s.has(ks) && v.has(kv) && g.has(kg)) n += count;
		}
		return n;
	}

	function layout() {
		const on = document.querySelector('input[name=layout]:checked');
		return on ? on.value : 'single';
	}

	function sections() {
		const on = document.querySelector('input[name=sections]:checked');
		return on ? on.value : 'screen';
	}

	// with a page per screen, "Group + screen" is the same as "Group": that choice is hidden there
	const SECTION_HINTS = {
		'single screen': 'A section per screen size, with a row per group.',
		'single group': 'A section per group (e.g. “My pages”), with a row per screen size. Groups are set in the control panel.',
		'single group-screen': 'A section per group and screen size, e.g. “My pages — Desktop”. Groups are set in the control panel.',
		'pages screen': 'A row per group on each screen size’s page.',
		'pages group': 'A section per group on each screen size’s page. Groups are set in the control panel.',
	};
	function showSections() {
		const pages = layout() === 'pages';
		if (pages && sections() === 'group-screen') document.querySelector('input[name=sections][value=group]').checked = true;
		$('groupScreen').hidden = pages;
		$('sectionsChoice').classList.toggle('two', pages);
		$('sectionsHint').textContent = SECTION_HINTS[layout() + ' ' + sections()] || '';
	}

	function refresh(updateStatus) {
		const missing = choices ? lists.filter(l => shown(l) && !picked(l).length) : [];
		lists.forEach(l => { if (sectionOf(l)) sectionOf(l).classList.toggle('missing', missing.includes(l)); });
		const n = frameCount();
		$('go').disabled = busy || imported || !choices || missing.length > 0 || n === 0;
		$('go').textContent = busy ? 'Importing…' : imported ? 'Imported ✓' : n && !missing.length ? 'Import ' + n + ' frame' + (n === 1 ? '' : 's') : 'Import';
		if (updateStatus !== false && choices && !busy) {
			setStatus(missing.length ? missing[0].need : n ? 'Ready to import ' + n + ' frame' + (n === 1 ? '' : 's') + '.' : 'Nothing matches that selection.');
		}
	}

	function size(o) {
		return o.width && o.height ? o.width + ' × ' + o.height : '';
	}

	// the user changed what to import: Import is available again
	function changed() {
		imported = false;
		refresh();
	}
	document.querySelectorAll('input[name=layout], input[name=sections], #autoLayout').forEach(r => { r.addEventListener('change', changed); });
	document.querySelectorAll('input[name=layout], input[name=sections]').forEach(r => { r.addEventListener('change', showSections); });
	showSections();

	function showChoices(msg) {
		imported = false;
		choices = {screens: msg.screens, variants: msg.variants, groups: msg.groups, combos: msg.combos};
		lists = makeLists(msg);
		$('choices').innerHTML = lists.filter(shown).map(l => '<section class="choice" data-list="' + l.id + '">'
			+ '<div class="section-head"><h2>' + esc(l.title) + '<span class="req">required</span></h2>'
			+ '<div class="links"><button class="link" data-all type="button">All</button><button class="link" data-none type="button">None</button></div></div>'
			+ '<div class="list">' + l.options.map(o => '<label class="row">'
				+ '<input type="checkbox" value="' + esc(o.id) + '">'
				+ '<span class="grow"><span class="name">' + esc(o.label) + '</span>' + (size(o) ? '<span class="dim">' + size(o) + '</span>' : '') + '</span>'
				+ '<span class="pill" title="pages">' + o.count + '</span></label>').join('') + '</div>'
			+ (l.hint ? '<p class="hint">' + esc(l.hint) + '</p>' : '')
			+ '</section>').join('');
		$('choices').querySelectorAll('.choice').forEach(sec => {
			sec.querySelectorAll('input').forEach(b => { b.onchange = changed; });
			sec.querySelector('[data-all]').onclick = () => { sec.querySelectorAll('input').forEach(b => { b.checked = true; }); changed(); };
			sec.querySelector('[data-none]').onclick = () => { sec.querySelectorAll('input').forEach(b => { b.checked = false; }); changed(); };
		});
		const ns = msg.screens.length, nv = msg.variants.length;
		$('fileName').textContent = msg.project || msg.source || 'Capture';
		$('fileMeta').textContent = msg.total + ' page' + (msg.total === 1 ? '' : 's') + ' · ' + ns + ' size' + (ns === 1 ? '' : 's')
			+ (nv > 1 ? ' · ' + nv + ' variants' : '') + (msg.source && msg.project ? ' · ' + msg.source : '');
		document.body.classList.add('loaded');
		$('report').classList.remove('show');
		refresh();
	}

	// ---- import -----------------------------------------------------------------------------------------

	// the plugin window cannot open links itself: the plugin opens the repository page
	$('repo').onclick = e => {
		e.preventDefault();
		send({type: 'open-repo'});
	};

	$('go').onclick = () => {
		busy = true;
		$('report').classList.remove('show');
		$('bar').classList.add('show');
		$('bar').firstElementChild.style.width = '0';
		setStatus('Starting…');
		refresh(false);
		const sel = {screens: picked(listById('screens'))};
		if (choices.variants.length > 1) sel.variants = pickedVariants();
		if (choices.groups.length > 1) sel.groups = picked(listById('groups'));
		send(Object.assign({type: 'import', layout: layout(), sections: sections(), autoLayout: $('autoLayout').checked}, sel));
	};

	// the plugin's report: first line = summary, "Heading:" lines, "• item" and "⚠ note" lines
	function showReport(text) {
		const lines = text.split('\n');
		const ok = /^Done/.test(lines[0]) && !/\nFailed:/.test(text);
		let html = '<div class="headline ' + (ok ? 'ok' : 'bad') + '">'
			+ (ok ? '<svg width="14" height="14" viewBox="0 0 16 16" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M3 8.5l3.2 3L13 5"/></svg>' : '<svg width="14" height="14" viewBox="0 0 16 16" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"><path d="M8 4v5M8 12v.01"/></svg>')
			+ esc(lines[0]) + '</div>';
		let open = false;
		for (const l of lines.slice(1)) {
			if (l.startsWith('• ') || l.startsWith('⚠ ')) {
				if (!open) { html += '<ul>'; open = true; }
				html += '<li' + (l.startsWith('⚠') ? ' class="warn"' : '') + '>' + esc(l.startsWith('• ') ? l.slice(2) : l) + '</li>';
			} else {
				if (open) { html += '</ul>'; open = false; }
				html += '<h3>' + esc(l.replace(/:$/, '')) + '</h3>';
			}
		}
		if (open) html += '</ul>';
		$('report').innerHTML = html;
		$('report').classList.add('show');
		$('report').scrollIntoView({block: 'nearest'});
	}

	onmessage = (e) => {
		const msg = e.data.pluginMessage;
		if (!msg) return;
		if (msg.type === 'settings') {
			const r = document.querySelector('input[name=layout][value="' + msg.layout + '"]');
			if (r) r.checked = true;
			$('autoLayout').checked = !!msg.autoLayout;
			const sec = document.querySelector('input[name=sections][value="' + msg.sections + '"]');
			if (sec) sec.checked = true;
			showSections();
		}
		if (msg.type === 'loaded') showChoices(msg);
		if (msg.type === 'error') setStatus(msg.text, true);
		if (msg.type === 'progress') {
			setStatus(msg.total ? msg.done + ' / ' + msg.total + ' · ' + msg.text : msg.text);
			if (msg.total) $('bar').firstElementChild.style.width = Math.round(100 * msg.done / msg.total) + '%';
		}
		if (msg.type === 'done') {
			busy = false;
			$('bar').classList.remove('show');
			imported = !/^Error/.test(msg.text);
			setStatus(imported ? 'Finished. Change the selection or layout to import more.' : msg.text, !imported);
			if (!/^Error/.test(msg.text)) showReport(msg.text);
			refresh(false);
		}
	};
</script>
